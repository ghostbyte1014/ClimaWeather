<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F1A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ClimaWeather</title>
    <link rel="manifest" href="/manifest.json" />
    <style>
      #offline-fallback {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background-color: #0B0F1A;
        color: #f1f5f9;
        font-family: 'Inter', system-ui, sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
      }
      #offline-fallback svg {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        color: #64748b;
      }
      #offline-fallback h1 {
        font-size: 28px;
        margin: 0 0 12px 0;
        font-weight: 600;
      }
      #offline-fallback p {
        font-size: 16px;
        color: #94a3b8;
        max-width: 400px;
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body class="bg-[#0B0F1A] text-slate-100 antialiased min-h-screen selection:bg-blue-500/30">
    <div id="root"></div>
    <div id="offline-fallback">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0Z" />
      </svg>
      <h1>No Internet Connection</h1>
      <p>It looks like you're offline. We need an internet connection to fetch the latest weather data. Please check your connection and we'll automatically reconnect you.</p>
    </div>
    <script>
      function updateOnlineStatus() {
        const isOnline = navigator.onLine;
        const root = document.getElementById('root');
        const fallback = document.getElementById('offline-fallback');
        if (isOnline) {
          root.style.display = 'block';
          fallback.style.display = 'none';
        } else {
          root.style.display = 'none';
          fallback.style.display = 'flex';
        }
      }
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      updateOnlineStatus(); // Run once on load
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
